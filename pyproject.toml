[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sbb-pytorch"
version = "0.2.0"
description = "PyTorch implementation of the SBB pixelwise document-image segmentation models (layout, textline, binarization, printspace, glyph)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "The SBB PyTorch contributors" },
]
keywords = [
    "document-analysis",
    "layout-analysis",
    "ocr",
    "segmentation",
    "pytorch",
    "eynollah",
    "sbb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# torch/torchvision are declared here so the package resolves, but the *active*
# PyTorch build (CPU vs cu118 vs cu121 vs rocm) must be chosen before install --
# see the Installation section of README.md. pip cannot pick the CUDA variant itself.
# This list is what src/ imports, plus the tooling the entry points need. Seven packages the
# legacy requirements.txt carried are not in it, because the port imports none of them: Pillow
# (images are read with cv2, not PIL.Image), scikit-learn (metrics.py imported sklearn and never
# called it), shapely (areas come from cv2.contourArea), matplotlib and seaborn (Keras-era
# plotting, superseded by rich). scipy and tqdm were dropped for the same reason and still install
# on their own -- albumentations requires scipy>=1.10 and pytorch_lightning requires tqdm -- so
# their pins (the .ndimage alias note that justified scipy>=1.11 among them) went with them.
# docs/migration.md 5.7 records the decision; PyYAML stays because dev declares types-PyYAML and
# the config loaders are the documented place a YAML config would be added.
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pytorch_lightning>=2.0",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8",
    # albumentations <1.4.5 cannot import against numpy 2.x.
    "albumentations>=1.4.5",
    "pydantic>=2.5",
    "click>=8.1",
    "rich>=13.0",
    "PyYAML>=6.0",
    "tensorboard>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/qbayee/sbb_pixelwise_segmentation"
Changelog = "https://github.com/qbayee/sbb_pixelwise_segmentation/blob/main/CHANGELOG.md"

[project.scripts]
sbb = "sbb_pytorch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sbb_pytorch"]
artifacts = ["src/sbb_pytorch/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",
]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # default-value function calls are the click/pydantic idiom
    "SIM108",  # ternary suggestions often hurt readability here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:pkg_resources.*:"]
